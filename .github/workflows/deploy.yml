on:
  push:
    branches: [main]  # Change to 'master' if that's your default branch
  workflow_dispatch:  # Allows you to manually trigger from GitHub UI

jobs:
    build:
        runs-on: ghcr.io/prefix-dev/pixi:latest

        steps:
            # ... checkout and install dependencies

            - name: 📄 Export notebook
              run: |
                  eval "$(pixi shell-hook)"
                  marimo export html-wasm 2026-sql-data-modeling.py -o site --mode edit -f --no-sandbox

            - name: 📦 Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        permissions:
            pages: write
            id-token: write

        steps:
            - name: 🌐 Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
              with:
                  artifact_name: github-pages